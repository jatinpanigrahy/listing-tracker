name: Scheduled Price Tracker Run

on:
  schedule:
    # Runs everyday at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode (fast or deep)'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - deep
      pages:
        description: 'Max pages to scrape (leave empty for all)'
        required: false
        default: '5'

jobs:
  track-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Price Tracker
        run: |
          PAGES_FLAG="${{ github.event.inputs.pages || '5' }}"
          MODE_FLAG="${{ github.event.inputs.mode || 'fast' }}"
          python -m src.cli --mode "$MODE_FLAG" --pages "$PAGES_FLAG" --export-csv

      - name: Commit and Push Updated Data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest_listings.csv data/price_history.csv data/tracker.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated price tracker update [skip ci]" && git push)

      - name: Upload Data Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-tracker-data
          path: data/
          retention-days: 30
